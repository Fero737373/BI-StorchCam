services:
  bi-storchcam:
    build: .
    image: bi-storchcam:latest
    container_name: bi-storchcam
    restart: unless-stopped
    user: "1000:1000"
    # Videogruppen des Hosts für GPU-Zugriff (video=44, render=992).
    group_add:
      - "44"
      - "992"
    shm_size: "512m"
    # Dockers Standard-Seccomp-Profil verhindert die Chromium-Sandbox; so bleibt sie aktiv statt --no-sandbox.
    security_opt:
      - seccomp=unconfined

    ports:
      # Standard nur auf dem Pi selbst (http://localhost:8080). Für „Am Handy“ in einer .env
      # BI_STORCHCAM_BIND=0.0.0.0 setzen; Geräte im Heimnetz brauchen dann einen Kopplungscode.
      - "${BI_STORCHCAM_BIND:-127.0.0.1}:8080:8000"

    volumes:
      - ./data:/data
      # Wayland-/Audio-Sockets der Desktop-Sitzung; rslave, damit die Sitzung auch nach dem Containerstart erscheint.
      - type: bind
        source: /run/user
        target: /run/user
        bind:
          propagation: rslave
      # Bluetooth-Lautsprecher: bluetoothctl spricht über den System-D-Bus mit BlueZ auf dem Host.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

    devices:
      - /dev/dri:/dev/dri

    environment:
      - TZ=Europe/Berlin
      - XDG_RUNTIME_DIR=/run/user/1000
      - WAYLAND_DISPLAY=wayland-0
      - XDG_SESSION_TYPE=wayland
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      # Kiosk-Browser auf dem angeschlossenen Bildschirm starten (0 = nur Server).
      - BI_STORCHCAM_KIOSK=${BI_STORCHCAM_KIOSK:-1}
      - BI_STORCHCAM_STREAM_URL=${BI_STORCHCAM_STREAM_URL:-}
      # Optional; alternativ im Menü unter „System“ eintragen. Wert z. B. in einer .env-Datei neben dieser Datei.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      # PIN-Schutz für das Menü nur bei Bedarf einschalten (1), dann wird BI_STORCHCAM_ADMIN_PIN gebraucht.
      - BI_STORCHCAM_REQUIRE_PIN=${BI_STORCHCAM_REQUIRE_PIN:-0}
      - BI_STORCHCAM_ADMIN_PIN=${BI_STORCHCAM_ADMIN_PIN:-}
      # Adresse, unter der Handys den Pi erreichen (steht im QR-Code), z. B. http://fero.local:8080
      - BI_STORCHCAM_PUBLIC_URL=${BI_STORCHCAM_PUBLIC_URL:-}
